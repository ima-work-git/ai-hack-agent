name: Preparation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  preparation-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check preparation documents and tracked filenames
        run: python3 scripts/check_preparation.py
